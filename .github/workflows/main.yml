name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: outils
        run: apt-get update -qq && apt-get install -y -qq build-essential git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: compiler
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make
      - uses: actions/upload-artifact@v4
        with:
          name: sloperinaGZ-build
          path: |
            bin/subsdk9
            bin/*.ips
